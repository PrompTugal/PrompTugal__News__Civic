name: Pages
# From the site repositories made by sites@AgentiCCells.dinis (2026-11-16). In the
# template itself (.factory-template exists) nothing is deployed: it is built,
# checked and versioned only. A seeded site deploys on every push to dev.
on:
  push:
    branches: [dev]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
env:
  # Major and minor are set here by a person. The patch number is set by this workflow only:
  # the first release is v0.1.0, and each later push to dev adds one.
  VERSION_BASE: '0.1'
jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      deploy: ${{ steps.mode.outputs.deploy }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: No release during a hold
        run: if [ -e board/HOLD.md ]; then echo "board/HOLD.md exists" >&2; exit 1; fi
      - id: version
        name: Work out the next version from the tags
        run: |
          last=$(git tag --list "v${VERSION_BASE}.*" | sed "s/^v${VERSION_BASE}\.//" | grep -E '^[0-9]+$' | sort -n | tail -1 || true)
          if [ -z "$last" ]; then next=0; else next=$((last + 1)); fi
          echo "version=v${VERSION_BASE}.${next}" >> "$GITHUB_OUTPUT"
          echo "Version: v${VERSION_BASE}.${next}"
      - id: mode
        name: Deploy unless this is the template itself
        run: if [ -e .factory-template ]; then echo deploy=false >> "$GITHUB_OUTPUT"; else echo deploy=true >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/build.mjs
        env:
          SITE_VERSION: ${{ steps.version.outputs.version }}
      - run: node scripts/validate.mjs
      - name: Tests of the trusted-check controls 6 to 9 (they need the built site)
        run: node tools/test-trusted-checks.mjs
      - name: The built site, for the security job to scan as data
        uses: actions/upload-artifact@v4
        with:
          name: site-for-checks
          path: _site
          retention-days: 1
      - if: steps.mode.outputs.deploy == 'true'
        uses: actions/configure-pages@v5
  checks:
    # security@'s controls 7 (widened) and 8, 19 Nov 2026 (Website board/team/security/reviews/2026-11-19-0130-bar-signing-live-data.md,
    # fae9649db; civic CIVIC-2026-007). A job of its own that runs no code from the pushed tree: the commit check, its exemptions and
    # the leak scan come from the anchor A (security@'s fourth to sixth rulings) and run from RUNNER_TEMP; the built site comes from the build
    # job as data. Fails closed (see the trusted step). Deploy waits for this job.
    # Limit (Dinis's to close): this workflow file can be changed by anyone who can push; only branch protection with a
    # required check closes that.
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    env:
      GIT_NO_REPLACE_OBJECTS: '1'
      NODE_OPTIONS: ''
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: The built site, downloaded before any trusted copy exists
        # events.b@'s finding (188bcf8): unpack first, so no member of the archive can write into the trusted copies.
        uses: actions/download-artifact@v4
        with:
          name: site-for-checks
          path: ${{ runner.temp }}/site-in
      - name: Only plain files and folders in the built site
        env:
          SITE_IN: ${{ runner.temp }}/site-in
        run: |
          if [ -e _site ] || [ -L _site ]; then echo "the checkout holds a _site: refused" >&2; exit 1; fi
          bad=$(find "$SITE_IN" ! -type f ! -type d -print -quit)
          if [ -n "$bad" ]; then echo "the built site holds something that is not a plain file or folder: $bad" >&2; exit 1; fi
          mv "$SITE_IN" _site
      - id: anchor
        name: The anchor A, the head of the newest successful push run of this workflow on dev
        # security@'s sixth ruling (Website 0ba439611): A is the head_sha of the newest run of this workflow (its path) on
        # dev, from a push, that concluded success, read from GitHub's API with this run's own read token. Only GitHub Actions
        # creates runs; a deployment record can be made by anyone with write access (civic's finding), so it is not used.
        # A run concludes success only when its checks job passed. Tags are not used.
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          a=$(gh api "repos/$REPO/actions/workflows/pages.yml/runs?branch=dev&event=push&status=success&per_page=30" \
            --jq '[.workflow_runs[] | select(.path == ".github/workflows/pages.yml" and .head_branch == "dev" and .event == "push" and .conclusion == "success")][0].head_sha // ""')
          if ! printf '%s' "$a" | grep -Eq '^[0-9a-f]{40}$'; then echo "no anchor: no successful push run of this workflow on dev" >&2; exit 1; fi
          echo "sha=$a" >> "$GITHUB_OUTPUT"
          echo "Anchor A: $a"
      - id: trusted
        name: The trusted checkers, from A's tree
        # The range checked is A..AFTER, so the commits of pushes whose runs GitHub dropped are covered. The checkers and their
        # config come from A's tree. Fails closed when A is missing, is not a commit here, is not an ancestor of AFTER (a force
        # push or an unrelated history), or has no copy of a checker. tools/test-trusted-checks.mjs runs this very block.
        env:
          AFTER: ${{ github.sha }}
          A: ${{ steps.anchor.outputs.sha }}
        run: |
          if [ "$(git rev-parse --is-shallow-repository)" != false ]; then echo "shallow checkout refused" >&2; exit 1; fi
          if [ -L scripts ] || { [ -e scripts ] && [ ! -d scripts ]; }; then echo "scripts/ is not a plain folder" >&2; exit 1; fi
          if ! printf '%s' "$A" | grep -Eq '^[0-9a-f]{40}$' || printf '%s' "$A" | grep -Eq '^0+$'; then echo "no anchor A: refused" >&2; exit 1; fi
          if [ "$(git cat-file -t "$A" 2>/dev/null)" != commit ]; then echo "the anchor A is not a commit in this clone" >&2; exit 1; fi
          if ! git merge-base --is-ancestor "$A" "$AFTER"; then echo "the anchor A is not an ancestor of AFTER (a force push or an unrelated history): refused" >&2; exit 1; fi
          for f in scripts/check-commits.mjs scripts/leak-scan.mjs; do
            if ! git cat-file -e "$A:$f" 2>/dev/null; then echo "the anchor A has no copy of $f: refused" >&2; exit 1; fi
          done
          for p in scripts/check-commits.mjs scripts/commit-exemptions.json scripts/leak-scan.mjs; do
            if [ -L "$p" ]; then echo "$p is a symlink: refused" >&2; exit 1; fi
          done
          node_bin=$(readlink -f "$(command -v node)")
          if [ ! -x "$node_bin" ]; then echo "no node binary" >&2; exit 1; fi
          t="${RUNNER_TEMP:-$PWD/.trusted}/trusted"; rm -rf "$t"; mkdir -p "$t"
          git show "$A:scripts/check-commits.mjs" > "$t/check-commits.mjs"
          git show "$A:scripts/leak-scan.mjs" > "$t/leak-scan.mjs"
          # the commit check reads its exemptions from scripts/ in the checkout: A's copy, or none
          mkdir -p scripts; rm -f scripts/commit-exemptions.json
          if git cat-file -e "$A:scripts/commit-exemptions.json" 2>/dev/null; then git show "$A:scripts/commit-exemptions.json" > scripts/commit-exemptions.json; fi
          # every config the checks read comes from A too (signals.b@'s finding, 75a59d0): git's own .gitattributes and .gitignore
          for f in .gitattributes .gitignore; do
            if [ -L "$f" ]; then echo "$f is a symlink: refused" >&2; exit 1; fi
            rm -f "$f"; if git cat-file -e "$A:$f" 2>/dev/null; then git show "$A:$f" > "$f"; fi
          done
          # A's leak scan runs from the temporary folder once it takes --root (civic 19 Nov 2026); an older one runs in place
          if grep -q -- "--root" "$t/leak-scan.mjs"; then leak="$t/leak-scan.mjs"; else rm -f scripts/leak-scan.mjs; cp "$t/leak-scan.mjs" scripts/leak-scan.mjs; leak=scripts/leak-scan.mjs; fi
          { echo "sha=$A"; echo "from=$A"; echo "node=$node_bin"; echo "commits=$t/check-commits.mjs"; echo "leak=$leak"; } >> "$GITHUB_OUTPUT"
      - name: Every commit in A..AFTER carries an Agent trailer (A's checker)
        # From A, not github.event.before: GitHub drops a pending run when a newer one queues, and the surviving run's
        # "before" is the dropped push's head, never checked (specialist.code@ finding 3b; security@'s fourth ruling).
        env:
          AFTER: ${{ github.sha }}
          FROM: ${{ steps.trusted.outputs.from }}
          NODE_BIN: ${{ steps.trusted.outputs.node }}
          CHECKER: ${{ steps.trusted.outputs.commits }}
        run: '"$NODE_BIN" "$CHECKER" "$FROM" "$AFTER"'
      - name: Still only plain files and folders in the built site
        run: 'bad=$(find _site ! -type f ! -type d -print -quit); if [ -n "$bad" ]; then echo "not a plain file or folder: $bad" >&2; exit 1; fi'
      - name: Leak scan of the tracked files and the built site (A's copy)
        env:
          NODE_BIN: ${{ steps.trusted.outputs.node }}
          LEAK: ${{ steps.trusted.outputs.leak }}
        run: '"$NODE_BIN" "$LEAK" --root "$GITHUB_WORKSPACE"'
      - name: The Pages artifact, made from the very bytes just scanned
        # library.b@'s finding (37621a6): the deployed bytes are the scanned bytes. Made on every run (the template, which
        # never deploys, uploads it unused), so this job reads nothing the build job decides.
        uses: actions/upload-pages-artifact@v3
        with:
          name: pages-checked-${{ github.run_id }}
          path: _site
  deploy:
    needs: [build, checks]
    if: needs.build.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          # the checks job's artifact, by a name only it uses, so an artifact from the build job cannot take its place
          artifact_name: pages-checked-${{ github.run_id }}
  tag:
    needs: [build, checks, deploy]
    if: ${{ always() && needs.build.result == 'success' && needs.checks.result == 'success' && (needs.deploy.result == 'success' || needs.deploy.result == 'skipped') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Tag the released commit
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          git tag "$VERSION" "$GITHUB_SHA"
          git push origin "$VERSION"
