name: Pages
# From the site repositories made by sites@AgentiCCells.dinis (2026-11-16). In the
# template itself (.factory-template exists) nothing is deployed: it is built,
# checked and versioned only. A seeded site deploys on every push to dev.
on:
  push:
    branches: [dev]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
env:
  # Major and minor are set here by a person. The patch number is set by this workflow only:
  # the first release is v0.1.0, and each later push to dev adds one.
  VERSION_BASE: '0.1'
jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      deploy: ${{ steps.mode.outputs.deploy }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: No release during a hold
        run: if [ -e board/HOLD.md ]; then echo "board/HOLD.md exists" >&2; exit 1; fi
      - id: version
        name: Work out the next version from the tags
        run: |
          last=$(git tag --list "v${VERSION_BASE}.*" | sed "s/^v${VERSION_BASE}\.//" | grep -E '^[0-9]+$' | sort -n | tail -1 || true)
          if [ -z "$last" ]; then next=0; else next=$((last + 1)); fi
          echo "version=v${VERSION_BASE}.${next}" >> "$GITHUB_OUTPUT"
          echo "Version: v${VERSION_BASE}.${next}"
      - id: mode
        name: Deploy unless this is the template itself
        run: if [ -e .factory-template ]; then echo deploy=false >> "$GITHUB_OUTPUT"; else echo deploy=true >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tests of the trusted-check controls (7 widened, 8, the CI override refusal, the shallow refusal)
        run: node tools/test-trusted-checks.mjs
      - run: node scripts/build.mjs
        env:
          SITE_VERSION: ${{ steps.version.outputs.version }}
      - run: node scripts/validate.mjs
      - name: The built site, for the security job to scan as data
        uses: actions/upload-artifact@v4
        with:
          name: site-for-checks
          path: _site
          retention-days: 1
      - if: steps.mode.outputs.deploy == 'true'
        uses: actions/configure-pages@v5
      - if: steps.mode.outputs.deploy == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  checks:
    # security@'s controls 7 (widened) and 8, 19 Nov 2026 (Website board/team/security/reviews/2026-11-19-0130-bar-signing-live-data.md,
    # fae9649db; civic CIVIC-2026-007). A job of its own that runs no code from the pushed tree: the commit check, its exemptions and
    # the leak scan come from BEFORE (security@'s third ruling, 3724c9ca2) and run in place; the built site comes from the build
    # job as data. Fails closed (see the trusted step). Deploy waits for this job.
    # Limit (Dinis's to close): this workflow file can be changed by anyone who can push; only branch protection with a
    # required check closes that.
    needs: build
    runs-on: ubuntu-latest
    env:
      GIT_NO_REPLACE_OBJECTS: '1'
      NODE_OPTIONS: ''
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: trusted
        name: The trusted checkers, from BEFORE (the commit dev pointed to before this push)
        # security@'s third ruling (Website 3724c9ca2): the checkers come from BEFORE only, never from a tag, the trusted base
        # or the pushed tree. Fails closed when BEFORE is missing or zero (a new branch, a manual run), when BEFORE is not an
        # ancestor of AFTER (a force push), or when BEFORE has no copy of a checker. The range checked still starts at the last
        # release at or before BEFORE, so the commits of a run GitHub dropped are checked too: a tag can only widen the range.
        # tools/test-trusted-checks.mjs runs this very block in throw-away repositories.
        env:
          AFTER: ${{ github.sha }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$(git rev-parse --is-shallow-repository)" != false ]; then echo "shallow checkout refused" >&2; exit 1; fi
          if [ -L scripts ] || { [ -e scripts ] && [ ! -d scripts ]; }; then echo "scripts/ is not a plain folder" >&2; exit 1; fi
          if ! printf '%s' "$BEFORE" | grep -Eq '^[0-9a-f]{40}$' || printf '%s' "$BEFORE" | grep -Eq '^0+$'; then echo "no BEFORE commit (a new branch or a manual run): refused" >&2; exit 1; fi
          if [ "$(git cat-file -t "$BEFORE" 2>/dev/null)" != commit ]; then echo "BEFORE is not a commit in this clone" >&2; exit 1; fi
          if ! git merge-base --is-ancestor "$BEFORE" "$AFTER"; then echo "BEFORE is not an ancestor of AFTER (a force push): refused" >&2; exit 1; fi
          for f in scripts/check-commits.mjs scripts/leak-scan.mjs; do
            if ! git cat-file -e "$BEFORE:$f" 2>/dev/null; then echo "BEFORE has no copy of $f: refused" >&2; exit 1; fi
          done
          from=$(git describe --tags --abbrev=0 --match "v0.1.*" "$BEFORE" 2>/dev/null || true)
          from=${from:+$(git rev-parse --verify "${from}^{commit}")}
          echo "sha=$BEFORE" >> "$GITHUB_OUTPUT"
          echo "from=${from:-$BEFORE}" >> "$GITHUB_OUTPUT"
          echo "Trusted checkers from BEFORE $BEFORE; range from ${from:-$BEFORE}"
          mkdir -p scripts
          rm -rf scripts/check-commits.mjs scripts/commit-exemptions.json scripts/leak-scan.mjs
          git show "$BEFORE:scripts/check-commits.mjs" > scripts/check-commits.mjs
          git show "$BEFORE:scripts/leak-scan.mjs" > scripts/leak-scan.mjs
          if git cat-file -e "$BEFORE:scripts/commit-exemptions.json" 2>/dev/null; then git show "$BEFORE:scripts/commit-exemptions.json" > scripts/commit-exemptions.json; fi
      - name: Every commit since the last release at or before BEFORE carries an Agent trailer (BEFORE's checker)
        # The range starts at the last release at or before BEFORE, not at BEFORE: GitHub drops a pending run when a
        # newer one queues, and the surviving run's "before" is the dropped push's head, so the dropped push's
        # commits would otherwise go unchecked (specialist.code@ finding 3b). The checker itself is BEFORE's.
        env:
          AFTER: ${{ github.sha }}
          FROM: ${{ steps.trusted.outputs.from }}
        run: node scripts/check-commits.mjs "$FROM" "$AFTER"
      - uses: actions/download-artifact@v4
        with:
          name: site-for-checks
          path: _site
      - name: Leak scan of the tracked files and the built site (the trusted copy)
        run: node scripts/leak-scan.mjs
  deploy:
    needs: [build, checks]
    if: needs.build.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
  tag:
    needs: [build, checks, deploy]
    if: ${{ always() && needs.build.result == 'success' && needs.checks.result == 'success' && (needs.deploy.result == 'success' || needs.deploy.result == 'skipped') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Tag the released commit
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          git tag "$VERSION" "$GITHUB_SHA"
          git push origin "$VERSION"
